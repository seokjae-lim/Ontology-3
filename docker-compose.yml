services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: u_oip
      POSTGRES_USER: u_oip
      POSTGRES_PASSWORD: u_oip
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U u_oip -d u_oip"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: bash -lc "alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:3000"]
